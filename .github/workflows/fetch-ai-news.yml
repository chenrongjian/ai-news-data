name: Fetch AI News

on:
  schedule:
    # 每天 16:30 UTC = 北京时间 00:30（凌晨更新）
    - cron: '30 16 * * *'
    # 每天 04:30 UTC = 北京时间 12:30（午间更新）
    - cron: '30 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ai-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch AI news data
        run: node scripts/fetch-ai-news.js

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 AI 资讯数据 ($(date -u +'%Y-%m-%d'))"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
